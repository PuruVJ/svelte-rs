[package]
name = "svelte_test_harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Walks packages/svelte/tests/ fixture directories and diffs Rust compiler output against the JS compiler (the golden master)."

[[bin]]
name = "svelte_test_harness"
path = "src/main.rs"

[dependencies]
svelte_compiler = { workspace = true }
svelte_ast = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
