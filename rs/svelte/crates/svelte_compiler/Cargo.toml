[package]
name = "svelte_compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Public facade: compile(), compileModule(), parse(), preprocess(), migrate(). Mirrors packages/svelte/src/compiler/index.js."

[[bin]]
name = "svelte-rs"
path = "src/bin/svelte_rs.rs"

[[bin]]
name = "bench_in_proc"
path = "src/bin/bench_in_proc.rs"

[[bin]]
name = "bench_profile"
path = "src/bin/bench_profile.rs"
required-features = ["profile"]

[[bin]]
name = "bench_phases"
path = "src/bin/bench_phases.rs"

[[bench]]
name = "compile"
harness = false

[dependencies]
svelte_ast = { workspace = true }
svelte_js_ast = { workspace = true }
svelte_diagnostics = { workspace = true }
svelte_parse = { workspace = true }
svelte_analyze = { workspace = true }
svelte_transform_client = { workspace = true }
svelte_transform_server = { workspace = true }
svelte_codegen_js = { workspace = true }
svelte_preprocess = { workspace = true }
svelte_migrate = { workspace = true }
svelte_print = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pprof = { version = "0.14", optional = true, features = ["flamegraph"] }

[features]
profile = ["dep:pprof"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = { workspace = true }
