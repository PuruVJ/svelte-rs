[package]
name = "svelte_wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "wasm-bindgen surface for svelte_compiler — returns JS-shaped objects identical to packages/svelte/src/compiler/index.js."

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
# Bundled wasm-opt rejects bulk-memory ops our toolchain emits. The pre-opt
# artifact is functionally correct — disable the post-build optimization.
wasm-opt = false

[dependencies]
svelte_compiler = { workspace = true }
svelte_preprocess = { workspace = true }
wasm-bindgen = { workspace = true }
serde-wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
svelte_diagnostics = { workspace = true }
